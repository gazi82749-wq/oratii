<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2A93B"/>
      <stop offset="100%" stop-color="#2FBF9F"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#1B2140"/>

  <!-- Badge body (rounded rect) -->
  <rect x="200" y="210" width="680" height="580" rx="120" fill="#1B2140" stroke="#2a3260" stroke-width="3"/>

  <!-- Speech bubble triangle -->
  <path d="M 250 740 L 250 850 L 380 740 Z" fill="#1B2140" stroke="#2a3260" stroke-width="3" stroke-linejoin="round"/>
  <!-- Cover the stroke overlap -->
  <rect x="252" y="710" width="135" height="35" fill="#1B2140"/>

  <!-- Corner shine -->
  <clipPath id="badgeClip">
    <rect x="200" y="210" width="680" height="580" rx="120"/>
  </clipPath>
  <g clip-path="url(#badgeClip)">
    <path d="M 700 210 L 880 210 L 880 390 Z" fill="#FFFFFF" opacity="0.06"/>
  </g>

  <!-- Sound wave bars -->
  <rect x="340" y="520" width="52" height="160" rx="26" fill="url(#waveGrad)"/>
  <rect x="420" y="430" width="52" height="290" rx="26" fill="url(#waveGrad)"/>
  <rect x="500" y="360" width="52" height="370" rx="26" fill="url(#waveGrad)"/>
  <rect x="580" y="410" width="52" height="260" rx="26" fill="url(#waveGrad)"/>
  <rect x="660" y="490" width="52" height="170" rx="26" fill="url(#waveGrad)"/>
</svg>
