<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <!-- Vibrant Brand Soundwave Gradient -->
    <linearGradient id="oratiiWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A93B"/>
      <stop offset="100%" stop-color="#2FBF9F"/>
    </linearGradient>

    <!-- Subtle Badge Gloss Clip -->
    <clipPath id="oratiiBadgeClip">
      <rect x="36" y="24" width="440" height="400" rx="92"/>
    </clipPath>
  </defs>

  <!-- Speech Bubble Tail (Bottom Left) -->
  <path d="M 85 390 L 85 478 L 175 400 Z" fill="#151930"/>

  <!-- Speech Bubble Rounded Container with Gold Contrast Stroke -->
  <rect x="36" y="24" width="440" height="400" rx="92" fill="#151930" stroke="#F2A93B" stroke-width="10"/>

  <!-- Subtle Top-Right Accent Shine -->
  <g clip-path="url(#oratiiBadgeClip)">
    <path d="M 330 24 L 476 24 L 476 170 Z" fill="#FFFFFF" opacity="0.08"/>
  </g>

  <!-- 5 Prominent Centered Soundwave Bars (Orange to Emerald Gradient) -->
  <g transform="translate(0, 0)">
    <!-- Bar 1 -->
    <rect x="110" y="200" width="36" height="120" rx="18" fill="url(#oratiiWaveGrad)"/>
    <!-- Bar 2 -->
    <rect x="168" y="140" width="36" height="240" rx="18" fill="url(#oratiiWaveGrad)"/>
    <!-- Bar 3 (Center Peak) -->
    <rect x="226" y="90"  width="36" height="320" rx="18" fill="url(#oratiiWaveGrad)"/>
    <!-- Bar 4 -->
    <rect x="284" y="150" width="36" height="210" rx="18" fill="url(#oratiiWaveGrad)"/>
    <!-- Bar 5 -->
    <rect x="342" y="210" width="36" height="100" rx="18" fill="url(#oratiiWaveGrad)"/>
  </g>
</svg>
