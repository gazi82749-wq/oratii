  <text x="212" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#64748B" letter-spacing="4">SAY IT WELL. SHOW IT WELL.</text>
