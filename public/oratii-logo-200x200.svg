<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soundwave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#F2A93B"/>
      <stop offset="100%" stopColor="#2FBF9F"/>
    </linearGradient>

    <!-- Clip path for badge shine -->
    <clipPath id="badgeClip">
      <rect x="0" y="0" width="200" height="200" rx="40"/>
    </clipPath>
  </defs>

  <!-- Dark Navy Background (#1B2140) -->
  <rect width="200" height="200" rx="40" fill="#1B2140"/>

  <g clipPath="url(#badgeClip)">
    <path d="M 140 0 L 200 0 L 200 60 Z" fill="#FFFFFF" opacity="0.08"/>
  </g>

  <!-- Centered Navbar Logo Content for 200x200 -->
  <g transform="translate(14, 58)">
    <!-- Icon Badge -->
    <g transform="translate(0, 0) scale(0.36)">
      <rect x="30" y="50" width="200" height="200" rx="52" fill="#1B2140" stroke="#2E3760" stroke-width="6"/>
      <g>
        <rect x="66"  y="145" width="16" height="60"  rx="8" fill="url(#waveGrad)"/>
        <rect x="92"  y="115" width="16" height="120" rx="8" fill="url(#waveGrad)"/>
        <rect x="118" y="95"  width="16" height="160" rx="8" fill="url(#waveGrad)"/>
        <rect x="144" y="125" width="16" height="100" rx="8" fill="url(#waveGrad)"/>
        <rect x="170" y="150" width="16" height="50"  rx="8" fill="url(#waveGrad)"/>
      </g>
    </g>

    <!-- Typography: Oratii + Tagline -->
    <g transform="translate(82, 45)">
      <!-- Main Brand Text -->
      <text font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="30" letter-spacing="-1">
        <tspan fill="#FFFFFF">Orat</tspan><tspan fill="#F2A93B">ii</tspan>
      </text>

      <!-- Subtitle Tagline -->
      <text y="16" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="5.8" letter-spacing="1.2" fill="#94A3B8">
        SAY IT WELL. SHOW IT WELL.
      </text>
    </g>
  </g>
</svg>
